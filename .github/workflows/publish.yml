# Publishes to PyPI and the official MCP registry.
#
# The two are deliberately SEPARATE jobs, and each can be run on its own:
#
#   * tag push (v*)        -> tests, then PyPI, then the registry
#   * manual, target=pypi  -> tests, then PyPI only
#   * manual, target=registry -> tests, then the registry only
#
# That separation matters because the two can fail independently. A registry
# submission that fails after PyPI already accepted the upload must not require
# re-publishing the package -- PyPI refuses a re-upload of the same version, so
# a combined job would leave you stuck. Run the registry half again instead.
#
# Both use OIDC, so no long-lived tokens are stored in the repo:
#   PyPI     -> Trusted Publishing (configure at pypi.org before the first run)
#   Registry -> GitHub OIDC, proving ownership of the io.github.AImplifier
#               namespace declared in server.json
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish"
        type: choice
        options: [both, pypi, registry]
        default: both

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[lsl,serial,dev]"
      # Runs first and fails fast. A registry rejection is only discovered
      # after the PyPI upload has already succeeded, and PyPI uploads cannot be
      # repeated -- so metadata problems must be caught before anything ships.
      - run: python testing/verify_packaging.py
      # Never publish anything that has not just passed its own suite.
      - run: python testing/verify.py
      - run: python testing/verify_recording.py
      - run: python testing/verify_processing.py
      - run: python testing/persona_bci_researcher.py
      - run: python testing/persona_clinician.py

  pypi:
    needs: test
    if: github.event_name == 'push' || inputs.target != 'registry'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/eeg-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI permanently refuses a re-upload of a version it already has.
          # Without this, tagging a release that was first published by a
          # manual pypi-only run would fail here -- and that failure would
          # then skip the registry job, stranding the submission. Treating an
          # already-present version as a no-op keeps the two halves
          # independently re-runnable, which is the point of splitting them.
          skip-existing: true

  registry:
    needs: [test, pypi]
    # Runs when PyPI succeeded, and also when the PyPI job was skipped because
    # this is a registry-only run.
    if: |
      always() && !cancelled() &&
      needs.test.result == 'success' &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped') &&
      (github.event_name == 'push' || inputs.target != 'pypi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          chmod +x mcp-publisher
      - name: Wait for PyPI to index the release
        # The registry validates that the package in server.json actually
        # exists, and PyPI's index lags the upload by a little. Skipped on a
        # registry-only run, where the release is already long since indexed.
        if: needs.pypi.result == 'success'
        run: sleep 90
      - name: Publish to MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
